services:
  db:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_USER: returns_admin
      POSTGRES_PASSWORD: ${RETURNS_DB_PASSWORD:?run environment required}
      POSTGRES_DB: returns_app
    ports:
      - "127.0.0.1:${RETURNS_DB_PORT:?run port required}:5432"
    volumes:
      - data:/var/lib/postgresql
    labels:
      io.returns.workspace: ${RETURNS_WORKSPACE:?workspace identity required}
      io.returns.run: ${RETURNS_RUN_ID:?run identity required}
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returns_admin -d returns_app"]
      interval: 1s
      timeout: 3s
      retries: 40
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
  simulator-db:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_USER: simulator_admin
      POSTGRES_PASSWORD: ${SIMULATOR_DB_PASSWORD:?run environment required}
      POSTGRES_DB: payment_simulator
    ports:
      - "127.0.0.1:${SIMULATOR_DB_PORT:?run port required}:5432"
    volumes:
      - simulator-data:/var/lib/postgresql
    labels:
      io.returns.workspace: ${RETURNS_WORKSPACE:?workspace identity required}
      io.returns.run: ${RETURNS_RUN_ID:?run identity required}
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator_admin -d payment_simulator"]
      interval: 1s
      timeout: 3s
      retries: 40
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  data:
    labels:
      io.returns.workspace: ${RETURNS_WORKSPACE}
      io.returns.run: ${RETURNS_RUN_ID}
  simulator-data:
    labels:
      io.returns.workspace: ${RETURNS_WORKSPACE}
      io.returns.run: ${RETURNS_RUN_ID}
networks:
  default:
    labels:
      io.returns.workspace: ${RETURNS_WORKSPACE}
      io.returns.run: ${RETURNS_RUN_ID}
    ipam:
      config:
        - subnet: ${RETURNS_SUBNET:?verified subnet required}
