name: Check application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm test:environment
      - name: Release disposable environments
        if: always()
        run: pnpm env:clean --all --apply
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: failure-diagnostics
          path: .local/last-failure.log
          retention-days: 7
          if-no-files-found: ignore
