name: Check application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: npx --yes pnpm@11.23.0 install --frozen-lockfile
      - run: pnpm browser:install --with-deps
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: npx --yes pnpm@11.23.0 run build:demo
      - run: pnpm exec playwright test --config playwright.demo.config.ts
      - run: pnpm test:integration
      - run: pnpm test:environment
      - run: pnpm test:e2e
      - run: pnpm test:e2e:environment
      - run: pnpm demo:verify
      - name: Release disposable environments
        if: always()
        run: pnpm env:clean --all --apply
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            .local/last-failure.log
            .local/e2e-last-failure/
            .local/browser-demo-results/
          retention-days: 7
          if-no-files-found: ignore
